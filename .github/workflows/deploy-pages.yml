name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true liga o GitHub Pages sozinho na primeira execucao,
      # entao nao e preciso mexer em Settings > Pages na mao.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O painel e um arquivo unico sem build: publica a raiz do repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
